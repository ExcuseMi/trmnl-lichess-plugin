---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.4.6
serverless_language: node
refresh_interval_floor: ''
polling_url: ''
polling_headers: ''
polling_body: ''
id: 540460
oauth_enabled: 'true'
oauth_pkce_enabled: 'yes'
oauth_authorize_url: https://lichess.org/oauth
oauth_token_url: https://lichess.org/api/token
oauth_scopes: puzzle:read
oauth_auth_params: '{"code_challenge_method":"S256"}'
custom_fields:
- keyname: author_info
  name: About This Plugin
  field_type: author_bio
  description: 'Unofficial. Lichess puzzles at your level on your TRMNL. A crisp e-ink chessboard with the puzzle to solve and the moves that led to it, and a QR code that opens exactly this puzzle on your phone. Connect Lichess with the OAuth button above for unseen puzzles at your rating, your rating, streak and week. Without a login it shows the Lichess daily puzzle.<br /><br />Data: <strong>Lichess</strong> (lichess.org) API. Pieces: Colin M.L. Burnett (Cburnett), BSD licence. Not affiliated with or endorsed by Lichess.org.'
  github_url: https://github.com/ExcuseMi/trmnl-your-move-plugin
  category: games
- keyname: difficulty
  group: Lichess
  field_type: select
  name: Difficulty
  description: Puzzle difficulty relative to your puzzle rating. Connect Lichess with the OAuth button above to get puzzles at your level.
  options:
  - Easiest: easiest
  - Easier: easier
  - Normal: normal
  - Harder: harder
  - Hardest: hardest
  default: normal
- keyname: orientation
  group: Board
  field_type: select
  name: Board orientation
  options:
  - Side to move at the bottom: side
  - White at the bottom: white
  - Black at the bottom: black
  default: side
- keyname: coordinates
  group: Board
  field_type: select
  name: Coordinates
  options:
  - Show: show
  - Hide: hide
  default: show
- keyname: hide_title_bar
  group: Board
  field_type: boolean
  name: Hide title bar
  default: false
name: Lichess
description: ''
refresh_interval: 60
