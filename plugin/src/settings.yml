---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.4.6
serverless_language: node
refresh_interval_floor: ''
polling_url: ''
polling_headers: ''
polling_body: ''
id: 540460
oauth_enabled: 'true'
oauth_pkce_enabled: 'yes'
oauth_authorize_url: https://lichess.org/oauth
oauth_token_url: https://lichess.org/api/token
oauth_scopes: puzzle:read
oauth_auth_params: '{"code_challenge_method":"S256"}'
custom_fields:
- keyname: author_info
  name: About This Plugin
  field_type: author_bio
  description: 'Unofficial. Lichess on your TRMNL: puzzles at your level with a QR code to solve them on your phone, your correspondence games where it is your turn, your profile with ratings and a rating chart, the top live game right now, or a player you follow. Connect Lichess with the OAuth button above; without a login it shows the daily puzzle.<br /><br />Data: <strong>Lichess</strong> (lichess.org) API. Pieces: Colin M.L. Burnett (Cburnett), BSD licence. Not affiliated with or endorsed by Lichess.org.'
  github_url: https://github.com/ExcuseMi/trmnl-your-move-plugin
  category: games
- keyname: mode
  field_type: select
  name: Mode
  description: What the screen shows. Connect Lichess with the OAuth button above.
  options:
  - Puzzles: puzzles
  - Your games: games
  - Profile: profile
  - Top game: top
  - Follow a player: following
  default: puzzles
  conditional_validation:
  - when: puzzles
    visible:
    - difficulty
    - puzzle_focus
  - when: following
    visible:
    - follow_username
    required:
    - follow_username
- keyname: difficulty
  field_type: select
  name: Difficulty
  description: Puzzle difficulty relative to your puzzle rating.
  options:
  - Easiest: easiest
  - Easier: easier
  - Normal: normal
  - Harder: harder
  - Hardest: hardest
  default: normal
  optional: true
- keyname: puzzle_focus
  field_type: select
  name: Puzzle focus
  description: My weakest theme trains the theme you solve worst (at least 10 attempts in the last 30 days, checked once a day).
  options:
  - Any theme: any
  - My weakest theme: weakest
  default: any
  optional: true
- keyname: follow_username
  field_type: string
  name: Player to follow
  description: Lichess username. Shows their current game, or their last one.
  placeholder: DrNykterstein
  optional: true
name: Lichess
description: ''
refresh_interval: 60
